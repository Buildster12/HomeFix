<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry Submitted | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar main-navbar">
    <div class="container">

        <a class="navbar-brand brand-logo" th:href="@{/}">
            <span class="brand-icon">H</span>
            HomeFix<span class="brand-dot">.</span>
        </a>

    </div>
</nav>

<section class="services-section">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="service-card text-center p-5">

                    <div class="why-icon icon-green mx-auto">
                        &#10003;
                    </div>

                    <h1 class="mb-3">Enquiry Submitted!</h1>

                    <p class="section-description mb-4">
                        Thank you for choosing HomeFix.
                        Your enquiry has been received successfully.
                    </p>

                    <p class="text-muted">
                        Our team can review your enquiry and contact you
                        using the details you provided.
                    </p>

                    <a th:href="@{/}"
                       class="btn btn-primary-custom mt-3">
                        Back to Home &rarr;
                    </a>

                </div>

            </div>
        </div>

    </div>
</section>

<footer class="main-footer">
    <div class="container">
        <div class="footer-content">

            <a class="brand-logo footer-logo" th:href="@{/}">
                <span class="brand-icon">H</span>
                HomeFix<span class="brand-dot">.</span>
            </a>

            <p>Making everyday home services simpler.</p>

        </div>
    </div>
</footer>

</body>
</html>
