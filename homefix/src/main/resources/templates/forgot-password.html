```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .forgot-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }

        .forgot-card {
            background: #fff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .forgot-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8f0ff;
            color: #0d6efd;
            font-size: 30px;
            border-radius: 50%;
            margin: 0 auto 20px;
        }
    </style>
</head>

<body>

<nav class="navbar main-navbar">
    <div class="container">
        <a class="navbar-brand brand-logo" th:href="@{/}">
            <span class="brand-icon">H</span>
            HomeFix<span class="brand-dot">.</span>
        </a>
    </div>
</nav>

<section class="forgot-wrapper">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">

                <div class="forgot-card">

                    <div class="text-center mb-4">

                        <div class="forgot-icon">&#128273;</div>

                        <span class="section-label">ACCOUNT RECOVERY</span>

                        <h2 class="mt-2">Forgot Password?</h2>

                        <p class="text-muted mt-3">
                            Enter your registered email address.
                            We'll send you an OTP to verify your identity.
                        </p>

                    </div>

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         th:text="${errorMessage}">
                    </div>

                    <div th:if="${successMessage}"
                         class="alert alert-success"
                         th:text="${successMessage}">
                    </div>

                    <form th:action="@{/customer/forgot-password}"
                          method="post">

                        <div class="mb-4">

                            <label for="email" class="form-label">
                                Registered Email Address
                            </label>

                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your registered email"
                                   autocomplete="email"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-primary-custom w-100">
                            Send OTP
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/customer/login}"
                           class="text-decoration-none">
                            &larr; Back to Login
                        </a>
                    </div>

                </div>

            </div>
        </div>

    </div>
</section>

<footer class="main-footer">
    <div class="container">
        <div class="footer-content">
            <p class="mb-0">HomeFix &copy; 2026</p>
        </div>
    </div>
</footer>

</body>
</html>
```
