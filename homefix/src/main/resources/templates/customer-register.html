<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .brand {
            color: #0d6efd;
            font-weight: 800;
        }

        .form-control {
            padding: 11px;
        }

        .btn-register {
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">
        <h2 class="brand">HomeFix</h2>
        <h4>Create Your Account</h4>
        <p class="text-muted">Register to access our home services.</p>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/customer/send-otp}"
          th:object="${customer}"
          method="post">

        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text"
                   id="name"
                   th:field="*{name}"
                   class="form-control"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   class="form-control"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-3">
            <label for="mobile" class="form-label">Mobile Number</label>
            <input type="tel"
                   id="mobile"
                   th:field="*{mobile}"
                   class="form-control"
                   placeholder="Enter your mobile number"
                   required>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password"
                   id="password"
                   th:field="*{password}"
                   class="form-control"
                   placeholder="Create a password"
                   required>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-register">
            Send Verification OTP
        </button>

    </form>

    <div class="text-center mt-4">
        <span class="text-muted">Already have an account?</span>
        <a th:href="@{/customer/login}" class="text-decoration-none">Login</a>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="text-muted text-decoration-none">
            Back to Home
        </a>
    </div>

</div>

</body>
</html>
