<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar main-navbar">
    <div class="container">
        <a class="navbar-brand brand-logo" th:href="@{/}">
            <span class="brand-icon">H</span>
            HomeFix<span class="brand-dot">.</span>
        </a>
    </div>
</nav>

<section class="services-section">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">

                <div class="service-card p-4 p-md-5">

                    <div class="text-center mb-4">
                        <span class="section-label">ADMIN PANEL</span>

                        <h1 class="mt-2">Welcome Back!</h1>

                        <p class="section-description">
                            Login to manage HomeFix enquiries.
                        </p>
                    </div>

                    <form th:action="@{/admin/login}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   id="username"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter username"
                                   autocomplete="username"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter password"
                                   autocomplete="current-password"
                                   required>
                        </div>


                        <div class="alert alert-danger"
                             th:if="${errorMessage}"
                             th:text="${errorMessage}">
                        </div>

                        <button type="submit"
                                class="btn btn-primary-custom w-100">
                            Login
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/}" class="text-decoration-none">
                            &larr; Back to Home
                        </a>
                    </div>

                </div>

            </div>
        </div>

    </div>
</section>

<footer class="main-footer">
    <div class="container">
        <div class="footer-content">
            <p class="mb-0">HomeFix Admin Panel &copy; 2026</p>
        </div>
    </div>
</footer>

</body>
</html>
