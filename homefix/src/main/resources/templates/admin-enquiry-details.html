<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry Details | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar main-navbar">
    <div class="container">

        <a class="navbar-brand brand-logo" th:href="@{/}">
            <span class="brand-icon">H</span>
            HomeFix<span class="brand-dot">.</span>
        </a>

        <div class="d-flex align-items-center gap-3">
            <span class="fw-semibold">Enquiry Details</span>

            <a th:href="@{/admin/logout}"
               class="btn btn-outline-danger btn-sm">
                Logout
            </a>
        </div>

    </div>
</nav>


<!-- ENQUIRY DETAILS -->
<section class="services-section">

    <div class="container">

        <div class="mb-4">
            <span class="section-label">ADMIN PANEL</span>

            <h1 class="mt-2">Customer Enquiry Details</h1>

            <p class="section-description">
                View complete information about this service enquiry.
            </p>
        </div>


        <div class="card border-0 shadow-sm">

            <div class="card-body p-4 p-md-5">

                <div class="d-flex justify-content-between align-items-center
                            flex-wrap gap-3 mb-4">

                    <h4 class="mb-0">
                        Enquiry #<span th:text="${enquiry.id}">1</span>
                    </h4>

                    <span class="badge text-bg-primary"
                          th:text="${enquiry.status}">
                        Pending
                    </span>

                </div>


                <hr>


                <div class="row g-4">

                    <div class="col-md-6">
                        <label class="text-muted small">
                            Customer Name
                        </label>

                        <p class="fw-semibold mb-0"
                           th:text="${enquiry.customerName}">
                            Customer Name
                        </p>
                    </div>


                    <div class="col-md-6">
                        <label class="text-muted small">
                            Mobile Number
                        </label>

                        <p class="fw-semibold mb-0"
                           th:text="${enquiry.mobileNumber}">
                            Mobile Number
                        </p>
                    </div>


                    <div class="col-md-6">
                        <label class="text-muted small">
                            Email Address
                        </label>

                        <p class="fw-semibold mb-0"
                           th:text="${enquiry.email}">
                            Email Address
                        </p>
                    </div>


                    <div class="col-md-6">
                        <label class="text-muted small">
                            Service Requested
                        </label>

                        <p class="fw-semibold mb-0"
                           th:text="${enquiry.serviceName}">
                            Service Name
                        </p>
                    </div>


                    <div class="col-12">
                        <label class="text-muted small">
                            Customer Address
                        </label>

                        <p class="fw-semibold mb-0"
                           th:text="${enquiry.address}">
                            Customer Address
                        </p>
                    </div>


                    <div class="col-12">
                        <label class="text-muted small">
                            Problem Description
                        </label>

                        <div class="bg-light rounded p-3">
                            <p class="mb-0"
                               th:text="${enquiry.description}">
                                Description
                            </p>
                        </div>
                    </div>

                </div>


                <hr class="my-4">


                <a th:href="@{/admin/enquiries}"
                   class="btn btn-outline-secondary">
                    &larr; Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</section>


<!-- FOOTER -->
<footer class="main-footer">
    <div class="container">
        <div class="footer-content">
            <p class="mb-0">
                HomeFix Admin Panel &copy; 2026
            </p>
        </div>
    </div>
</footer>

</body>
</html>
