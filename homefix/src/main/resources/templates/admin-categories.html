<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Categories | HomeFix</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">HomeFix Admin</a>

    <div>
      <a th:href="@{/admin/enquiries}"
         class="btn btn-outline-light btn-sm">
        Enquiries
      </a>

      <a th:href="@{/admin/logout}"
         class="btn btn-danger btn-sm">
        Logout
      </a>
    </div>
  </div>
</nav>

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>Manage Service Categories</h2>
      <p class="text-muted mb-0">
        Add, edit and manage your HomeFix services.
      </p>
    </div>

    <a th:href="@{/admin/categories/add}"
       class="btn btn-primary">
      + Add Category
    </a>
  </div>

  <div th:if="${successMessage}"
       class="alert alert-success"
       th:text="${successMessage}">
  </div>

  <div th:if="${errorMessage}"
       class="alert alert-danger"
       th:text="${errorMessage}">
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">

          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Service Name</th>
            <th>Description</th>
            <th>Active</th>
            <th>Actions</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="category : ${categories}">

            <td th:text="${category.id}"></td>

            <td th:text="${category.name}"></td>

            <td th:text="${category.description}"></td>

            <td>
                            <span th:if="${category.active}"
                                  class="badge bg-success">
                                Active
                            </span>

              <span th:unless="${category.active}"
                    class="badge bg-secondary">
                                Inactive
                            </span>
            </td>

            <td>
              <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}"
                 class="btn btn-sm btn-warning">
                Edit
              </a>

              <form th:action="@{/admin/categories/delete}"
                    method="post"
                    class="d-inline">

                <input type="hidden"
                       name="id"
                       th:value="${category.id}">

                <button type="submit"
                        class="btn btn-sm btn-danger">
                  Delete
                </button>
              </form>
            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="5" class="text-center py-4">
              No service categories found.
            </td>
          </tr>

          </tbody>
        </table>
      </div>

    </div>
  </div>

  <div class="mt-4">
    <a th:href="@{/}" class="btn btn-outline-secondary">
      Back to Homepage
    </a>
  </div>

</div>

</body>
</html>
