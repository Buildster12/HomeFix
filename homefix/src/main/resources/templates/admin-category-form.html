<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Service Category | HomeFix</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">HomeFix Admin</a>

    <a th:href="@{/admin/categories}"
       class="btn btn-outline-light btn-sm">
      Back to Categories
    </a>
  </div>
</nav>

<div class="container py-5">

  <div class="card shadow-sm mx-auto" style="max-width: 650px;">

    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"
          th:text="${editMode} ? 'Edit Service Category' : 'Add New Service Category'">
        Add New Service Category
      </h4>
    </div>

    <div class="card-body p-4">

      <div th:if="${errorMessage}"
           class="alert alert-danger"
           th:text="${errorMessage}">
      </div>

      <form th:action="${editMode}
                              ? @{/admin/categories/update}
                              : @{/admin/categories/add}"
            method="post"
            th:object="${category}">

        <input type="hidden"
               name="id"
               th:if="${editMode}"
               th:value="${category.id}">

        <div class="mb-3">
          <label for="name" class="form-label">
            Service Name
          </label>

          <input type="text"
                 id="name"
                 th:field="*{name}"
                 class="form-control"
                 placeholder="Example: AC Repair"
                 required>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">
            Description
          </label>

          <textarea id="description"
                    th:field="*{description}"
                    class="form-control"
                    rows="4"
                    placeholder="Describe the service"
                    required></textarea>
        </div>

        <div class="form-check mb-4">
          <input type="checkbox"
                 id="active"
                 th:field="*{active}"
                 class="form-check-input">

          <label for="active" class="form-check-label">
            Active service
          </label>
        </div>

        <button type="submit"
                class="btn btn-primary"
                th:text="${editMode} ? 'Update Category' : 'Save Category'">
          Save Category
        </button>

        <a th:href="@{/admin/categories}"
           class="btn btn-outline-secondary">
          Cancel
        </a>

      </form>

    </div>
  </div>

</div>

</body>
</html>
