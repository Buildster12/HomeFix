
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef4ff, #f8faff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .otp-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.09);
        }

        .brand {
            color: #0d6efd;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .otp-input {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 8px;
            padding: 14px;
        }

        .verify-btn {
            padding: 12px;
            font-weight: 600;
        }

        .email-text {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="otp-card">

    <div class="text-center mb-4">
        <h2 class="brand">HomeFix</h2>
        <h4 class="mt-3">Verify Your Email</h4>

        <p class="text-muted mt-3">
            We've sent a verification code to:
        </p>

        <p class="fw-semibold email-text" th:text="${email}">
            customer@example.com
        </p>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/customer/verify-otp}" method="post">

        <div class="mb-4">
            <label for="otp" class="form-label">Enter 6-digit OTP</label>

            <input type="text"
                   id="otp"
                   name="otp"
                   class="form-control otp-input"
                   placeholder="000000"
                   maxlength="6"
                   pattern="[0-9]{6}"
                   inputmode="numeric"
                   autocomplete="one-time-code"
                   required>
        </div>

        <button type="submit"
                class="btn btn-primary w-100 verify-btn">
            Verify OTP
        </button>

    </form>

    <div class="text-center mt-4">
        <p class="text-muted small mb-2">
            Enter the code received in your email.
        </p>

        <a th:href="@{/customer/register}"
           class="text-decoration-none">
            Back to Registration
        </a>
    </div>

</div>

</body>
</html>
