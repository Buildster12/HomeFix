
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef4ff, #f8faff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.09);
        }

        .brand {
            color: #0d6efd;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .form-control {
            padding: 12px;
        }

        .login-btn {
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">
        <h2 class="brand">HomeFix</h2>
        <h4 class="mt-3">Welcome Back!</h4>
        <p class="text-muted">Login to manage your home services.</p>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <form th:action="@{/customer/login}" method="post">

        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email"
                   id="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter your email"
                   autocomplete="email"
                   required>
        </div>


        <div class="mb-4">
            <label for="password" class="form-label">Password</label>

            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>

            <div class="text-end mt-2">
                <a th:href="@{/customer/forgot-password}"
                   class="text-decoration-none small">
                    Forgot Password?
                </a>
            </div>
        </div>



        <button type="submit" class="btn btn-primary w-100 login-btn">
            Login
        </button>

    </form>

    <div class="text-center mt-4">
        <p class="text-muted mb-2">Don't have an account?</p>
        <a th:href="@{/customer/register}" class="text-decoration-none">
            Create New Account
        </a>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="text-muted text-decoration-none">
            Back to Home
        </a>
    </div>

</div>

</body>
</html>
