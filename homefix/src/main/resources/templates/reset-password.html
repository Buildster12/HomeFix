
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .reset-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }

        .reset-card {
            background: #fff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

<nav class="navbar main-navbar">
    <div class="container">
        <a class="navbar-brand brand-logo" th:href="@{/}">
            <span class="brand-icon">H</span>
            HomeFix<span class="brand-dot">.</span>
        </a>
    </div>
</nav>

<section class="reset-wrapper">
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">

                <div class="reset-card">

                    <div class="text-center mb-4">
                        <span class="section-label">ACCOUNT RECOVERY</span>

                        <h2 class="mt-2">Reset Password</h2>

                        <p class="text-muted mt-3">
                            Enter the OTP sent to your email and choose a new password.
                        </p>
                    </div>

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         th:text="${errorMessage}">
                    </div>

                    <form th:action="@{/customer/reset-password}"
                          method="post">

                        <div class="mb-3">
                            <label for="otp" class="form-label">
                                Email Verification OTP
                            </label>

                            <input type="text"
                                   id="otp"
                                   name="otp"
                                   class="form-control"
                                   placeholder="Enter 6-digit OTP"
                                   maxlength="6"
                                   pattern="[0-9]{6}"
                                   inputmode="numeric"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">
                                New Password
                            </label>

                            <input type="password"
                                   id="newPassword"
                                   name="newPassword"
                                   class="form-control"
                                   placeholder="Enter new password"
                                   autocomplete="new-password"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">
                                Confirm New Password
                            </label>

                            <input type="password"
                                   id="confirmPassword"
                                   name="confirmPassword"
                                   class="form-control"
                                   placeholder="Re-enter new password"
                                   autocomplete="new-password"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary-custom w-100">
                            Verify OTP & Reset Password
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/customer/login}"
                           class="text-decoration-none">
                            &larr; Back to Login
                        </a>
                    </div>

                </div>

            </div>
        </div>

    </div>
</section>

<footer class="main-footer">
    <div class="container">
        <div class="footer-content">
            <p class="mb-0">HomeFix &copy; 2026</p>
        </div>
    </div>
</footer>

</body>
</html>
