<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Service Enquiry | HomeFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar main-navbar">
    <div class="container">
        <a class="navbar-brand brand-logo" th:href="@{/}">
            <span class="brand-icon">H</span>
            HomeFix<span class="brand-dot">.</span>
        </a>

        <a th:href="@{/}" class="btn btn-outline-custom">
            &larr; Back to Home
        </a>
    </div>
</nav>

<section class="services-section">
    <div class="container">

        <div class="text-center mb-5">
            <span class="section-label">WE ARE HERE TO HELP</span>
            <h1 class="mt-3">Request a Service</h1>
            <p class="section-description">
                Tell us what you need, and we'll receive your enquiry.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="service-card">

                    <form th:action="@{/enquiry}"
                          th:object="${enquiry}"
                          method="post">

                        <div class="mb-3">
                            <label for="customerName" class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="customerName"
                                   th:field="*{customerName}"
                                   placeholder="Enter your full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="mobileNumber" class="form-label">
                                Mobile Number
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   id="mobileNumber"
                                   th:field="*{mobileNumber}"
                                   placeholder="Enter your mobile number"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   th:field="*{email}"
                                   placeholder="Enter your email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="serviceName" class="form-label">
                                Select Service
                            </label>

                            <select class="form-select"
                                    id="serviceName"
                                    th:field="*{serviceName}"
                                    required>

                                <option value="">Choose a service</option>

                                <option th:each="category : ${categories}"
                                        th:if="${category.active}"
                                        th:value="${category.name}"
                                        th:text="${category.name}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">
                                Service Address
                            </label>

                            <textarea class="form-control"
                                      id="address"
                                      th:field="*{address}"
                                      rows="3"
                                      placeholder="Enter your complete address"
                                      required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">
                                Describe Your Problem
                            </label>

                            <textarea class="form-control"
                                      id="description"
                                      th:field="*{description}"
                                      rows="4"
                                      placeholder="Tell us what service you need"></textarea>
                        </div>

                        <button type="submit"
                                class="btn btn-primary-custom w-100">
                            Submit Enquiry &rarr;
                        </button>

                    </form>

                </div>

            </div>
        </div>

    </div>
</section>

<footer class="main-footer">
    <div class="container">
        <div class="footer-content">
            <a class="brand-logo footer-logo" th:href="@{/}">
                <span class="brand-icon">H</span>
                HomeFix<span class="brand-dot">.</span>
            </a>

            <p>Making everyday home services simpler.</p>
        </div>
    </div>
</footer>

</body>
</html>
